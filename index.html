<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue No. 01 — Curated Finds</title>
  <meta name="description" content="A small, hand-picked collection of products worth buying — no clutter, no ads, just things I actually like." />

  <!-- Open Graph tags: these control how the page looks when pasted into
       Slack, WhatsApp, iMessage, etc. Without them, a shared link just
       shows a bare URL and maybe a random screenshot. og:image is a real
       file committed in this repo (og-image.png), not a third-party image
       service, so it always loads with no external dependency. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Catalogue No. 01 — Curated Finds" />
  <meta property="og:description" content="A small, hand-picked collection of products worth buying — no clutter, no ads, just things I actually like." />
  <meta property="og:url" content="https://fungdoobit.github.io/catalogue/" />
  <meta property="og:image" content="https://fungdoobit.github.io/catalogue/og-image.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- This slim bar is hidden above the viewport at first (see
       .site-nav in styles.css). script.js watches #hero below with an
       IntersectionObserver and slides this into view only once the hero
       has scrolled fully out of sight — so it stays out of the way during
       the entrance, then acts as a persistent "you're on this site" anchor
       while browsing the grid. -->
  <header class="site-nav" id="site-nav">
    <p class="site-nav-title">Catalogue No. 01</p>
  </header>

  <!-- The entrance: fills the screen on load with the name and, right
       below it, a short subtitle that lights up word by word as you
       scroll. #hero-wrap is taller than one screen and #hero is pinned
       inside it with `position: sticky` — that extra height is what makes
       scrolling briefly "hold" the hero in place instead of sweeping it
       past in an instant, giving each word room to actually be seen
       animating in rather than all firing at once. See .hero-wrap and
       .hero in styles.css. -->
  <div class="hero-wrap" id="hero-wrap">
    <section class="hero" id="hero">
      <h1 class="hero-title">Catalogue No. 01</h1>
      <p class="hero-subtitle" id="hero-subtitle">Thoughtfully curated essentials</p>

      <!-- Fills the open space below the subtitle with something that
           actually responds to scrolling, instead of leaving it blank:
           script.js drives .hero-divider-fill's height with the exact
           same 0-1 progress value that lights up the subtitle's words
           (see updateSubtitleHighlight()), so the line fills in step
           with them — one continuous piece of motion, not two unrelated
           effects sharing a page. -->
      <div class="hero-divider" aria-hidden="true">
        <span class="hero-divider-fill" id="hero-divider-fill"></span>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span>Scroll to explore</span>
        <span class="scroll-cue-arrow">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 6l5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </div>
    </section>
  </div>

  <main>
    <!-- Search + category filters live together in one "controls" section
         so they visually read as one toolbar above the grid. -->
    <section class="controls">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search products…"
        aria-label="Search products"
      />

      <!-- Filled in by script.js from the categories (and subcategories)
           found in products.json, so adding a new one to the data file is
           enough — no HTML edits. One .category-pills row per drill-down
           level; renderCategoryPills() in script.js adds/removes whole
           rows as you go deeper or pick "All". -->
      <div id="category-pills" class="category-pill-rows"></div>
    </section>

    <!-- Filled in by script.js with one .product-card per item. -->
    <section id="product-grid" class="product-grid" aria-live="polite"></section>

    <!-- Shown by script.js only when a search/filter combo matches nothing. -->
    <p id="empty-state" class="empty-state" hidden>No products match your search.</p>
  </main>

  <footer class="site-footer">
    <p>As an affiliate, I may earn a commission from qualifying purchases.</p>
  </footer>

  <!-- Custom cursor: two small elements script.js moves every animation
       frame. Only ever shown on desktops with a real mouse — see the
       feature check in script.js — so this is inert on phones/tablets. -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-tail" id="cursor-tail" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
